<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Guide</title>
<style>
  :root{color-scheme:light dark;--paper:#f5efe2;--panel:#fff9ed;--ink:#2d241d;--muted:#685749;--line:#c7b596;--accent:#78521c}
  @media (prefers-color-scheme:dark){
    :root{--paper:#201c18;--panel:#2c2520;--ink:#f4e9d6;--muted:#cfbea7;--line:#6e5b47;--accent:#e9be79}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.5 "Source Sans 3",system-ui,sans-serif}
  main{max-width:64rem;margin:auto;padding:clamp(2.5rem,10vw,8rem) clamp(1rem,5vw,3rem)}
  h1,h2{font-family:"Cormorant Garamond",Georgia,serif;line-height:1.1}
  h1{font-size:clamp(3rem,8vw,5rem);margin:0 0 .3em}
  main>p{margin:0 0 2rem;color:var(--muted)}
  nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,20rem),1fr));gap:1rem}
  a{display:flex;flex-direction:column;padding:1.5rem;border:1px solid var(--line);border-radius:.75rem;background:var(--panel);color:inherit;text-decoration:none}
  a:hover,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  h2{font-size:clamp(1.5rem,4vw,2rem);margin:0}
  a p{margin:.6rem 0 1.25rem;color:var(--muted)}
  a span{margin-top:auto;color:var(--accent);font-weight:650}
</style>
</head>
<body>
<main>
  <h1>Book Guide</h1>
  <p>Reading companions in English and Czech.</p>
  <nav aria-label="Reading guides">
    <a href="lotr/hobit.html">
      <h2>The Hobbit</h2>
      <p>J. R. R. Tolkien · 19 chapters for parents and kids</p>
      <span>Open the guide →</span>
    </a>
    <a href="lotr/index.html">
      <h2>The Lord of the Rings</h2>
      <p>J. R. R. Tolkien · Three volumes</p>
      <span>Open the guide →</span>
    </a>
    <a href="malazan/index.html">
      <h2>Malazan Book of the Fallen</h2>
      <p>Steven Erikson · Ten volumes</p>
      <span>Open the guide →</span>
    </a>
  </nav>
</main>
</body>
</html>
